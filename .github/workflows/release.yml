name: release
on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub release
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            cafe.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: validate_tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The push.tags trigger above is a glob, not a SemVer check —
          # "v*.*.*" also matches non-numeric tags like "vfoo.bar.baz". Fail
          # closed here before generating notes or publishing a release.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not a valid release tag; expected vX.Y.Z (see RELEASE.md#versioning)"
            exit 1
          fi

      - name: release_note
        id: notes
        uses: purpleclay/release-note-action@9fa4adcdc68af9a0630f8d64fae6e38e31c259f7 # v0.2.0

      - name: publish_release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.notes.outputs.release-note-path }}
        run: |
          set -euo pipefail
          # gh always exits 1 on failure, whether the release is genuinely
          # absent, or the check itself failed (auth, network, GitHub API
          # error). Only the exact "release not found" message confirms
          # absence; anything else is a real failure and must abort here.
          #
          # Immutable releases mean an existing release for this tag can
          # never be deleted or modified, complete or not — there is no
          # recovery path here but a new tag (see "Fixing a bad release" in
          # RELEASE.md). So existence is treated as done, not something to
          # replace: no delete, ever, on this path.
          if view_output=$(gh release view "$TAG" 2>&1 >/dev/null); then
            echo "release for '$TAG' already exists; nothing to publish"
            url=$(gh release view "$TAG" --json url --jq '.url')
          elif [ "$view_output" = "release not found" ]; then
            url=$(gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE" \
              --verify-tag)
          else
            echo "::error::could not confirm whether a release for '$TAG' already exists: $view_output"
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
